[package]
name = "archpad-launch"
description = "Launchpad launch program: creates coins, runs their bonding curves, and graduates them into their pool."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Build as a library without the on-chain entrypoint.
no-entrypoint = []

[dependencies]
arch_program = { workspace = true }
apl-token = { workspace = true }
apl-associated-token-account = { workspace = true }
apl-token-metadata = { workspace = true }
archpad-interface = { workspace = true }
archpad-math = { workspace = true }
archpad-program-lib = { workspace = true }
borsh = { workspace = true }

[lints]
workspace = true

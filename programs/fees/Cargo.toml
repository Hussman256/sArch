[package]
name = "archpad-fees"
description = "Launchpad fee vault program: holds trade fees until creators claim theirs and the platform's are sent to the treasury."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Build as a library without the on-chain entrypoint.
no-entrypoint = []

[dependencies]
arch_program = { workspace = true }
apl-token = { workspace = true }
archpad-interface = { workspace = true }
archpad-program-lib = { workspace = true }
borsh = { workspace = true }

[lints]
workspace = true

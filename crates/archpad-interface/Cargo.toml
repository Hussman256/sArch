[package]
name = "archpad-interface"
description = "Account layouts, instructions, addresses, events and errors shared by the launchpad programs and their clients."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Pinned exactly: the account and instruction ABI must match the node version
# the programs are deployed to.
arch_program = "=0.12.0"
apl-token = { version = "=0.12.0", features = ["no-entrypoint"] }
apl-associated-token-account = { version = "=0.12.0", features = ["no-entrypoint"] }
apl-token-metadata = { version = "=0.12.0", features = ["no-entrypoint"] }
archpad-math = { path = "../archpad-math" }
borsh = { version = "1.5", features = ["derive"] }

[dev-dependencies]
# Only for generating the fixtures the TypeScript SDK is checked against:
# the node SDK's own transaction type, so the bytes come from the reference
# implementation rather than from a second copy of it.
arch_sdk = "=0.12.0"
serde_json = "1"
